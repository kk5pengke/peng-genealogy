    </section>
    <aside class="inspector" id="inspector">
      <div class="inspect-empty"><div class="big">譜</div>點選任一人物卡片，可查看其配偶、子嗣、旁註及對應照片。<br><br>第 6–15 張樹圖與第 16–48 張詳頁按同一譜系對讀；重名先按同一人整理，父系記載有衝突時保留來源並標註待核。</div>
    </aside>
  </main>
